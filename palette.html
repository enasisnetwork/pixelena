<!DOCTYPE html>
<html>
  <head>
    <title>Enasis Network Palette</title>

    <!-- link hrefs -->
    <link
     rel="icon"
     href="https://enasisnetwork.github.io/encommon/webkit/images/enasis.svg">
    <!-- link hrefs -->
    <link
     rel="stylesheet"
     href="https://enasisnetwork.github.io/encommon/webkit/styles/default.css">
    <!-- link hrefs -->

    <!-- overrides -->
    <style>
      body { padding: 10px 14px 10px 14px; }
      table tr th {
        font-family: monospace;
        font-size: 8px;
        color: #FFFFFF;
        text-align: center;
        white-space: normal; }
      table tr td {
        color: #FFFFFF;
        font-family: monospace;
        font-size: 10px;
        font-weight: bold;
        height: 60px;
        max-height: 60px;
        max-width: 60px;
        min-height: 60px;
        min-width: 60px;
        text-align: center;
        vertical-align: middle;
        width: 60px;
        transition: all 300ms; }
      table tr:nth-child(1) td {
        color: #000000; }
    </style>
    <!-- overrides -->

    <!-- scripts -->
    <script src="https://enasisnetwork.github.io/encommon/webkit/scripts/default.js"></script>
    <script src="https://enasisnetwork.github.io/encommon/webkit/scripts/helpers.js"></script>
    <!-- scripts -->

  </head>
  <body>

    <br>

        'BOOLI': ['089BD8', '0A5A79', '0C4359', '0B2F3E', '07171D', '050C0F']};



      function palette(
        palette,
      ) {

        let table = $('<table/>');
        let thead = $('<thead/>');
        let tbody = $('<tbody/>');
        table.append(thead);
        table.append(tbody);

        let trow = $('<tr/>');
        thead.append(trow);


        for (
          const [name, colors]
          of Object.entries(palette)
        ) {

          let tcell = $('<th/>');
          trow.append(tcell);
          tcell.text(name); }


        for (
          let count = 0;
          count < 6; count++
        ) {

          let trow = $('<tr/>');
          tbody.append(trow);

          for (
            const [name, colors]
            of Object.entries(palette)
          ) {

            let tcell = $('<td/>');
            trow.append(tcell);

            let color =
              `#${colors[count]}`;

            tcell.css(
              'background-color',
              color);

            tcell.text(color); } }

        return table; }



      $('#palette_legacy').html(
        palette(PALETTE_LEGACY));

      $('#palette_future1').html(
        palette(PALETTE_FUTURE1));

      $('#palette_future2').html(
        palette(PALETTE_FUTURE2));


    </script>

  </body>
</html>
