<!DOCTYPE html>
<html>
  <head>
    <title>Enasis Network Palette</title>

    <!-- link hrefs -->
    <link
     rel="icon"
     href="https://enasisnetwork.github.io/encommon/webkit/images/enasis.svg">
    <!-- link hrefs -->
    <link
     rel="stylesheet"
     href="https://enasisnetwork.github.io/encommon/webkit/styles/default.css">
    <!-- link hrefs -->

    <!-- overrides -->
    <style>
      body { padding: 10px 14px 10px 14px; }
      table tr th {
        font-family: monospace;
        font-size: 8px;
        color: #FFFFFF;
        text-align: center;
        white-space: normal; }
      table tr td {
        color: #FFFFFF;
        font-family: monospace;
        font-size: 10px;
        font-weight: bold;
        height: 60px;
        max-height: 60px;
        max-width: 60px;
        min-height: 60px;
        min-width: 60px;
        text-align: center;
        vertical-align: middle;
        width: 60px;
        transition: all 300ms; }
      table tr:nth-child(1) td,
       table tr:nth-child(2) td {
        color: #000000; }
    </style>
    <!-- overrides -->

    <!-- scripts -->
    <script src="https://enasisnetwork.github.io/encommon/webkit/scripts/default.js"></script>
    <script src="https://enasisnetwork.github.io/encommon/webkit/scripts/helpers.js"></script>
    <!-- scripts -->

  </head>
  <body>

    <!-- content -->
    <h1>Current Palette</h1>
    <div id="palette_old"></div>
    <br>
    <h1>Future Palette</h1>
    <div id="palette_new"></div>
    <script>


      let PALETTE_OLD = {
        'GRAY': ['E9E9E9', 'B7B7B7', '888888', '5B5B5B', '2C2C2C', '181818'],
        'RED': ['FF6666', 'CC3333', '990000', '660000', '330000', '1A0A0A'],
        'YELLOW': ['FFFF66', 'CCCC33', '999900', '666600', '333300', '1A1A0A'],
        'GREEN': ['66FF66', '33CC33', '009900', '006600', '003300', '0A1A0A'],
        'TEAL': ['66FFFF', '33CCCC', '009999', '006666', '003333', '0A1A1A'],
        'BLUE': ['089BD8', '0875A4', '065C81', '04415B', '032F42', '021822'],
        'PINK': ['FF00CC', 'CC00A3', '8F0072', '660052', '3D0031', '200019']};

      let PALETTE_NEW = {
        'GRAY': ['E9E9E9', '8B8B8B', '6B6B6B', '4D4D4D', '272727', '151515'],
        'RED': ['FF6666', 'CD0909', '960E0E', '680F0F', '320A0A', '1A0707'],
        'ORANGE': ['FF9900', '935B06', '6B440A', '4A310B', '231807', '120D05'],
        'YELLOW': ['FFFF66', 'CDCD09', '96960E', '68680F', '32320A', '1A1A07'],
        'LIME': ['00FF00', '069306', '0A6B0A', '0B4A0B', '072307', '051205'],
        'GREEN': ['66FF66', '09CD09', '0E960E', '0F680F', '0A320A', '071A07'],
        'CYAN': ['66FFFF', '09CDCD', '0E9696', '0F6868', '0A3232', '071A1A'],
        'TURQOS': ['66FFDD', '09CD9F', '0E9676', '0F6853', '0A3228', '071A15'],
        'BLUE': ['66DDFF', '09A3CD', '0E7996', '0F5568', '0A2932', '07161A'],
        'BOOLI': ['089BD8', '0A5A79', '0C4359', '0B2F3E', '07171D', '050C0F'],
        'PURPLE': ['CC00FF', '770693', '580A6B', '3E0B4A', '1E0723', '100512'],
        'PINK': ['FF00CC', '930677', '6B0A58', '4A0B3E', '23071E', '120510']};



      function palette(
        palette,
      ) {

        let table = $('<table/>');
        let thead = $('<thead/>');
        let tbody = $('<tbody/>');
        table.append(thead);
        table.append(tbody);

        let trow = $('<tr/>');
        thead.append(trow);


        for (
          const [name, colors]
          of Object.entries(palette)
        ) {

          let tcell = $('<th/>');
          trow.append(tcell);
          tcell.text(name); }


        for (
          let count = 0;
          count < 6; count++
        ) {

          let trow = $('<tr/>');
          tbody.append(trow);

          for (
            const [name, colors]
            of Object.entries(palette)
          ) {

            let tcell = $('<td/>');
            trow.append(tcell);

            let color =
              `#${colors[count]}`;

            tcell.css(
              'background-color',
              color);

            tcell.text(color); } }

        return table; }



      $('#palette_old').html(
        palette(PALETTE_OLD));

      $('#palette_new').html(
        palette(PALETTE_NEW));


    </script>

  </body>
</html>
